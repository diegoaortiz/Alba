[env:pico2w]
; Platform pinned to a COMMIT, never the bare repo: the bare URL follows master,
; and master moved (9c167c6, 2026-08-03, "Update to Arduino-Pico 6.0.0") to the
; GCC 16 toolchain (pico-quick-toolchain 5.0.0), which cannot build the 5.6.0
; core below ("'__getreent' was not declared" in malloc-lock.cpp). Every fresh
; install then failed while older machines kept working off their cache.
; aa70b80 (2026-07-01) is the last commit on toolchain 4.1.0 / GCC 14.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#aa70b802be8851668053d4f09734e4089fe41932
board = rpipico2w
framework = arduino
board_build.core = earlephilhower

; Pin the arduino-pico core to 5.6.0. The platform default (5.4.3) predates the
; reliable concurrent AP+STA implementation (PR #3374, landed in 5.5.1), which
; we rely on to keep the config hotspot up while reconnecting in the background.
; The release .zip bundles the submodules, so the git-submodule build breakage
; that a bare "#tag" reference triggers is avoided.
platform_packages =
    framework-arduinopico@https://github.com/earlephilhower/arduino-pico/releases/download/5.6.0/rp2040-5.6.0.zip

; Enable WiFi (captive portal + data upload) and Bluetooth LE (Improv WiFi
; provisioning from the AirCarto app, src/ble_improv.cpp -- arduino-pico's BLE
; library on BTstack).
; LV_CONF_INCLUDE_SIMPLE => LVGL picks up include/lv_conf.h
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_WIFI
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
    -DLV_CONF_INCLUDE_SIMPLE
    -I ${platformio.include_dir}

; Filesystem for storing WiFi credentials (256KB)
board_build.filesystem_size = 256k

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.8
    adafruit/Adafruit NeoPixel@^1.12.5
    kitesurfer1404/WS2812FX@^1.4.5
    lvgl/lvgl@^9.2.0

monitor_speed = 115200
